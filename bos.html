<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARSH</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #0f172a; }

    /* Ust marka cubugu (index.html ile ayni gorunum) */
    .brand-bar {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 16px;
    }
    .brand-bar img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
    }
    .brand-bar .spacer { display: inline-block; width: 14px; }
    .brand-bar .letter {
      font-size: 25px;
      font-weight: bold;
      font-family: 'Norwester', system-ui, sans-serif;
      display: inline-block;
    }
    .brand-bar .letter.l1, .brand-bar .letter.l2, .brand-bar .letter.l3 { letter-spacing: 32px; }
    .brand-bar .letter.l4 { letter-spacing: 12px; }

    /* Bos calisma alani */
    .workspace { height: calc(100% - 62px); width: 100%; }
  </style>
</head>
<body>
  <!-- Ayrı Marka Cubugu: ikon ve ARSH yazisi her ekranda ortada -->
  <div class="brand-bar">
    <span title="ARSH"><img src="./icons/icon-192.png" alt="ARSH" /></span>
    <span class="spacer"></span>
    <span class="letter l1">A</span>
    <span class="letter l2">R</span>
    <span class="letter l3">S</span>
    <span class="letter l4">H</span>
  </div>

  <!-- Bos bir uygulama alani: icerik yok, tamamen temiz -->
  <main class="workspace" aria-label="Bos calisma alani"></main>
</body>
</html>
