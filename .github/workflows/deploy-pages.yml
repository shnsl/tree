name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build publish folder
        env:
          FIREBASE_CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_CONFIG_JS}" ]; then
            echo "FIREBASE_CONFIG_JS secret eksik. GitHub > Settings > Secrets and variables > Actions" >&2
            exit 1
          fi
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          printf '%s\n' "$FIREBASE_CONFIG_JS" > _site/firebase-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
