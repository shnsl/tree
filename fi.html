<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FI</title>
  <script src="./app-config.js"></script>
  <style>
    :root {
      --brand-font: 'Norwester';
      --wp-bg: #ffffff;
      --wp-bar-bg: #ffffff;
      --wp-border: #e2e8f0;
      --wp-text: #0f172a;
    }
    /* Koyu mod: index.html ile ayni degerler */
    body.dark-mode {
      --wp-bg: #0f172a;
      --wp-bar-bg: #1e293b;
      --wp-border: #334155;
      --wp-text: #e2e8f0;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--wp-bg);
      color: var(--wp-text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* FI alani */
    .workspace { height: calc(100% - 62px); width: 100%; }
  </style>
  <script>
    // Marka fontunu (ARSH yazi tipi) ve temayi index.html ile ayni sekilde uygula.
    (function () {
      try {
        var cfg = self.PWA_CONFIG || {};
        var rs = document.documentElement.style;

        // 1) Koyu / acik mod: ayni localStorage anahtari kullanilir.
        var savedTheme = null;
        try { savedTheme = localStorage.getItem('theme-preference'); } catch (e) {}
        // index.html ile ayni mantik: 'light' acikca secilmediyse koyu mod.
        if (savedTheme !== 'light') {
          document.documentElement.classList.add('pre-dark');
        }

        // 2) Marka fontu: FONTS.BRAND -> ./fonts/<file>
        var brand = (cfg.FONTS && cfg.FONTS.BRAND) || {};
        if (cfg.BRAND_FONT) rs.setProperty('--brand-font', cfg.BRAND_FONT);
        if (brand && brand.name && brand.file) {
          var face = new FontFace(brand.name, 'url(./fonts/' + brand.file + ')', { weight: 'normal', style: 'normal', display: 'swap' });
          document.fonts.add(face);
          face.load().catch(function(){});
          rs.setProperty('--brand-font', brand.name);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Ayrı Marka Cubugu: ikon ve ARSH yazisi her ekranda ortada -->
  <div class="brand-bar w-full bg-white border-b border-slate-200 flex items-center justify-center py-1.5 px-4 transition-colors">
    <span onclick="window.toggleFiPage(event)" style="cursor:pointer;" title="Ana sayfaya don">
      <img src="./icons/icon-192.png" alt="ARSH" class="w-12 h-12 rounded-lg object-cover" title="Ana sayfaya don" /></span>
    &nbsp;
    &nbsp;
    &nbsp;
    &nbsp;
    &nbsp;
    <span style="font-size: 25px; font-weight: bold;font-family: var(--brand-font, 'Norwester'), sans-serif;letter-spacing: 32px;">A</span>
    <span style="font-size: 25px; font-weight: bold;font-family: var(--brand-font, 'Norwester'), sans-serif;letter-spacing: 32px;">R</span>
    <span style="font-size: 25px; font-weight: bold;font-family: var(--brand-font, 'Norwester'), sans-serif;letter-spacing: 32px;">S</span>
    <span style="font-size: 25px; font-weight: bold;font-family: var(--brand-font, 'Norwester'), sans-serif;letter-spacing: 32px;">H</span>
    </div>

  <!-- FI sayfa alani -->
  <main class="workspace" aria-label="FI"></main>

  <script>
    // head'de <body> hazir olmadan class eklenemez; burada body'e uygula.
    (function () {
      try {
        if (document.documentElement.classList.contains('pre-dark')) {
          document.body.classList.add('dark-mode');
        }
      } catch (e) {}
    })();

    // fi.html app.js yuklemez; ikon tiklaninca index.html'e don.
    window.toggleFiPage = function(e) {
      if (e) { try { e.preventDefault(); e.stopPropagation(); } catch (e2) {} }
      try { window.location.assign('./index.html'); } catch (err) { window.location.href = './index.html'; }
    };
  </script>
</body>
</html>
