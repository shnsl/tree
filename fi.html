<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#C4047E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="description" content="FI" />
  <title>FI</title>
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <script src="./app-config.js"></script>
  <link rel="manifest" id="dynamic-manifest" href="./manifest.webmanifest" />
  <script src="./head-init.js"></script>
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <script src="./fonts-init.js"></script>
</head>
<body class="w-screen h-screen overflow-hidden bg-slate-100 text-slate-800 flex flex-col select-none">
  <!-- Ayrı Marka Başlık Çubuğu: index.html ile aynı görünüm -->
  <div class="brand-bar w-full bg-white border-b border-slate-200 flex items-center justify-center py-1.5 px-4 transition-colors">
    <a href="./index.html" onclick="window.toggleFiPage(event)" style="cursor:pointer;" title="Ana sayfaya don">
      <img src="./icons/icon-192.png" alt="ARSH" class="w-12 h-12 rounded-lg object-cover" title="Ana sayfaya don" />
    </a>
    &nbsp;
    &nbsp;
    &nbsp;
    &nbsp;
    &nbsp;
    <span style="font-size: 25px; font-weight: bold;font-family: var(--brand-font, 'Norwester'), sans-serif;letter-spacing: 32px;">A</span>
    <span style="font-size: 25px; font-weight: bold;font-family: var(--brand-font, 'Norwester'), sans-serif;letter-spacing: 32px;">R</span>
    <span style="font-size: 25px; font-weight: bold;font-family: var(--brand-font, 'Norwester'), sans-serif;letter-spacing: 32px;">S</span>
    <span style="font-size: 25px; font-weight: bold;font-family: var(--brand-font, 'Norwester'), sans-serif;letter-spacing: 32px;">H</span>
  </div>

  <!-- Tuş alanı: index.html header ile aynı iskelet, içerik sonra eklenecek -->
  <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex flex-wrap items-center justify-between relative z-30 shadow-xs gap-3 transition-colors" aria-label="FI araç çubuğu">
    <div class="flex items-center gap-2 sm:gap-3 flex-wrap"></div>
    <div class="flex items-center gap-2"></div>
  </header>

  <!-- Ana alan: index.html tuval bölgesi ile aynı iskelet, içerik sonra eklenecek -->
  <main class="flex-1 relative overflow-hidden bg-slate-100 transition-colors" aria-label="FI">
    <div
      id="fi-workspace"
      class="absolute inset-0 overflow-hidden cursor-default"
      style="background-image: radial-gradient(var(--bg-canvas-dot) 1px, transparent 1px); background-color: var(--bg-canvas); background-size: 24px 24px;"
    ></div>
  </main>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme-preference');
        if (saved !== 'light') document.body.classList.add('dark-mode');
      } catch (e) {}
    })();
  </script>
</body>
</html>
